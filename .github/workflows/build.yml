name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 shellcheck

      - name: Lint scripts
        run: shellcheck install.sh uninstall.sh

      - name: Build
        run: |
          make -C shim
          cd shim && sha256sum cfgmgr32.dll > cfgmgr32.dll.sha256 && cat cfgmgr32.dll.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: cfgmgr32-shim
          path: |
            shim/cfgmgr32.dll
            shim/cfgmgr32.dll.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" shim/cfgmgr32.dll shim/cfgmgr32.dll.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
